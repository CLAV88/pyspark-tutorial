<svg width="680" height="420" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" role="img"><title>Partition vs table</title><desc>A single table on one machine vs the same data split across four workers</desc><rect x="20" y="20" width="280" height="340" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="160" y="52" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">Pandas — one machine</text><rect x="30" y="68" width="260" height="200" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/><text x="160" y="92" text-anchor="middle" font-size="12" fill="#0C447C">All rows on one machine</text><text x="160" y="112" text-anchor="middle" font-size="12" fill="#0C447C">Row 1 — Alice, CA, $4200</text><text x="160" y="132" text-anchor="middle" font-size="12" fill="#0C447C">Row 2 — Bob, NY, $3100</text><text x="160" y="152" text-anchor="middle" font-size="12" fill="#0C447C">Row 3 — Carol, TX, $5800</text><text x="160" y="172" text-anchor="middle" font-size="12" fill="#0C447C">Row 4 — Dan, CA, $2900</text><text x="160" y="192" text-anchor="middle" font-size="12" fill="#0C447C">Row 5 — Eve, NY, $6100</text><text x="160" y="212" text-anchor="middle" font-size="12" fill="#0C447C">Row 6 — Frank, TX, $3700</text><text x="160" y="232" text-anchor="middle" font-size="12" fill="#0C447C">Row 7 — Grace, CA, $4900</text><text x="160" y="252" text-anchor="middle" font-size="12" fill="#0C447C">Row 8 — Hank, NY, $5200</text><text x="160" y="330" text-anchor="middle" font-size="12" fill="#5F5E5A">One process. Your laptop is the limit.</text><rect x="360" y="20" width="300" height="340" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="510" y="52" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">Spark — partitioned</text><rect x="370" y="68" width="130" height="80" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="435" y="90" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">Worker 1</text><text x="435" y="108" text-anchor="middle" font-size="12" fill="#0F6E56">Row 1 — Alice</text><text x="435" y="126" text-anchor="middle" font-size="12" fill="#0F6E56">Row 2 — Bob</text><rect x="520" y="68" width="130" height="80" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="585" y="90" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">Worker 2</text><text x="585" y="108" text-anchor="middle" font-size="12" fill="#0F6E56">Row 3 — Carol</text><text x="585" y="126" text-anchor="middle" font-size="12" fill="#0F6E56">Row 4 — Dan</text><rect x="370" y="168" width="130" height="80" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="435" y="190" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">Worker 3</text><text x="435" y="208" text-anchor="middle" font-size="12" fill="#0F6E56">Row 5 — Eve</text><text x="435" y="226" text-anchor="middle" font-size="12" fill="#0F6E56">Row 6 — Frank</text><rect x="520" y="168" width="130" height="80" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="585" y="190" text-anchor="middle" font-size="13" font-weight="500" fill="#085041">Worker 4</text><text x="585" y="208" text-anchor="middle" font-size="12" fill="#0F6E56">Row 7 — Grace</text><text x="585" y="226" text-anchor="middle" font-size="12" fill="#0F6E56">Row 8 — Hank</text><rect x="430" y="268" width="160" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="510" y="286" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A">Driver</text><text x="510" y="302" text-anchor="middle" font-size="12" fill="#5F5E5A">combines results</text><text x="510" y="330" text-anchor="middle" font-size="12" fill="#5F5E5A">Four workers run in parallel.</text></svg>