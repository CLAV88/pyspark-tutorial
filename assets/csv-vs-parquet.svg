<svg width="680" height="360" viewBox="0 0 680 360" xmlns="http://www.w3.org/2000/svg" role="img"><title>CSV vs Parquet</title><desc>CSV stores plain text rows with no type info. Parquet stores a schema header and columnar binary data.</desc><rect x="20" y="20" width="290" height="320" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="165" y="48" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">CSV</text><text x="165" y="64" text-anchor="middle" font-size="12" fill="#5F5E5A">plain text, no type info</text><rect x="32" y="78" width="266" height="26" rx="4" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/><text x="165" y="95" text-anchor="middle" font-size="12" fill="#27500A">id, name, category, quantity, price</text><rect x="32" y="108" width="266" height="22" rx="3" fill="none" stroke="#D3D1C7" stroke-width="0.5"/><text x="42" y="123" font-size="11" fill="#5F5E5A">1, iPhone 12, Electronics, 10, 899.99</text><rect x="32" y="134" width="266" height="22" rx="3" fill="none" stroke="#D3D1C7" stroke-width="0.5"/><text x="42" y="149" font-size="11" fill="#5F5E5A">2, Nike Air Max, Clothing, 25, 119.99</text><rect x="32" y="160" width="266" height="22" rx="3" fill="none" stroke="#D3D1C7" stroke-width="0.5"/><text x="42" y="175" font-size="11" fill="#5F5E5A">3, KitchenAid, Appliances, 5, 299.99</text><rect x="32" y="186" width="266" height="22" rx="3" fill="none" stroke="#D3D1C7" stroke-width="0.5"/><text x="42" y="201" font-size="11" fill="#5F5E5A">4, Great Gatsby, Books, 50, 12.99</text><rect x="32" y="248" width="266" height="44" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/><text x="165" y="266" text-anchor="middle" font-size="12" font-weight="500" fill="#501313">All columns: string</text><text x="165" y="282" text-anchor="middle" font-size="12" fill="#791F1F">Types wrong unless told</text><text x="165" y="322" text-anchor="middle" font-size="12" fill="#5F5E5A">Reads every row to find any value.</text><rect x="370" y="20" width="290" height="320" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="515" y="48" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">Parquet</text><text x="515" y="64" text-anchor="middle" font-size="12" fill="#5F5E5A">binary, schema embedded in footer</text><rect x="382" y="78" width="266" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="515" y="100" text-anchor="middle" font-size="13" font-weight="500" fill="#04342C">Schema header</text><text x="515" y="118" text-anchor="middle" font-size="12" fill="#085041">id: INT   name: STRING</text><text x="515" y="134" text-anchor="middle" font-size="12" fill="#085041">quantity: INT   price: DOUBLE</text><rect x="382" y="152" width="50" height="120" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/><text x="407" y="174" text-anchor="middle" font-size="12" font-weight="500" fill="#042C53">id</text><text x="407" y="196" text-anchor="middle" font-size="11" fill="#185FA5">1</text><text x="407" y="214" text-anchor="middle" font-size="11" fill="#185FA5">2</text><text x="407" y="232" text-anchor="middle" font-size="11" fill="#185FA5">3</text><text x="407" y="250" text-anchor="middle" font-size="11" fill="#185FA5">4</text><rect x="438" y="152" width="70" height="120" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/><text x="473" y="174" text-anchor="middle" font-size="12" font-weight="500" fill="#042C53">price</text><text x="473" y="196" text-anchor="middle" font-size="11" fill="#185FA5">899.99</text><text x="473" y="214" text-anchor="middle" font-size="11" fill="#185FA5">119.99</text><text x="473" y="232" text-anchor="middle" font-size="11" fill="#185FA5">299.99</text><text x="473" y="250" text-anchor="middle" font-size="11" fill="#185FA5">12.99</text><rect x="514" y="152" width="60" height="120" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/><text x="544" y="174" text-anchor="middle" font-size="12" font-weight="500" fill="#2C2C2A">...</text><text x="544" y="210" text-anchor="middle" font-size="11" fill="#5F5E5A">name</text><text x="544" y="240" text-anchor="middle" font-size="11" fill="#5F5E5A">qty</text><rect x="382" y="288" width="266" height="26" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="515" y="305" text-anchor="middle" font-size="12" font-weight="500" fill="#04342C">Types guaranteed. Reads only needed columns.</text><text x="515" y="332" text-anchor="middle" font-size="12" fill="#085041">Spark skips columns your query does not use.</text></svg>