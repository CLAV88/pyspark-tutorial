<svg width="680" height="300" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img"><title>RDD vs DataFrame</title><desc>RDD uses anonymous positional tuples. DataFrame uses named columns with a schema.</desc><rect x="20" y="20" width="290" height="260" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/><text x="165" y="48" text-anchor="middle" font-size="14" font-weight="500" fill="#4A1B0C">RDD — anonymous tuples</text><text x="165" y="68" text-anchor="middle" font-size="12" fill="#712B13">reference by position: x[0], x[1]</text><rect x="34" y="82" width="262" height="30" rx="4" fill="#F0997B" stroke="#993C1D" stroke-width="0.5"/><text x="165" y="101" text-anchor="middle" font-size="12" fill="#4A1B0C">( "hello" , 4 )</text><rect x="34" y="118" width="262" height="30" rx="4" fill="#F0997B" stroke="#993C1D" stroke-width="0.5"/><text x="165" y="137" text-anchor="middle" font-size="12" fill="#4A1B0C">( "spark" , 3 )</text><rect x="34" y="154" width="262" height="30" rx="4" fill="#F0997B" stroke="#993C1D" stroke-width="0.5"/><text x="165" y="173" text-anchor="middle" font-size="12" fill="#4A1B0C">( "world" , 2 )</text><text x="165" y="240" text-anchor="middle" font-size="12" fill="#712B13">No schema. No column names.</text><text x="165" y="258" text-anchor="middle" font-size="12" fill="#712B13">Catalyst cannot optimize.</text><rect x="370" y="20" width="290" height="260" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="515" y="48" text-anchor="middle" font-size="14" font-weight="500" fill="#04342C">DataFrame — named columns</text><text x="515" y="68" text-anchor="middle" font-size="12" fill="#085041">reference by name: col("word")</text><rect x="384" y="82" width="130" height="30" rx="4" fill="#5DCAA5" stroke="#0F6E56" stroke-width="0.5"/><text x="449" y="101" text-anchor="middle" font-size="12" font-weight="500" fill="#04342C">word</text><rect x="520" y="82" width="126" height="30" rx="4" fill="#5DCAA5" stroke="#0F6E56" stroke-width="0.5"/><text x="583" y="101" text-anchor="middle" font-size="12" font-weight="500" fill="#04342C">count</text><rect x="384" y="118" width="130" height="28" rx="3" fill="none" stroke="#9FE1CB" stroke-width="0.5"/><text x="449" y="136" text-anchor="middle" font-size="12" fill="#085041">hello</text><rect x="520" y="118" width="126" height="28" rx="3" fill="none" stroke="#9FE1CB" stroke-width="0.5"/><text x="583" y="136" text-anchor="middle" font-size="12" fill="#085041">4</text><rect x="384" y="150" width="130" height="28" rx="3" fill="none" stroke="#9FE1CB" stroke-width="0.5"/><text x="449" y="168" text-anchor="middle" font-size="12" fill="#085041">spark</text><rect x="520" y="150" width="126" height="28" rx="3" fill="none" stroke="#9FE1CB" stroke-width="0.5"/><text x="583" y="168" text-anchor="middle" font-size="12" fill="#085041">3</text><rect x="384" y="182" width="130" height="28" rx="3" fill="none" stroke="#9FE1CB" stroke-width="0.5"/><text x="449" y="200" text-anchor="middle" font-size="12" fill="#085041">world</text><rect x="520" y="182" width="126" height="28" rx="3" fill="none" stroke="#9FE1CB" stroke-width="0.5"/><text x="583" y="200" text-anchor="middle" font-size="12" fill="#085041">2</text><text x="515" y="240" text-anchor="middle" font-size="12" fill="#085041">Schema known. Catalyst optimizes.</text><text x="515" y="258" text-anchor="middle" font-size="12" fill="#085041">Column pruning. Predicate pushdown.</text></svg>