<svg width="680" height="340" viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg" role="img"><title>groupBy vs window function</title><desc>groupBy collapses rows to one per group losing detail. Window function keeps all rows and adds a rank column.</desc><rect x="20" y="20" width="290" height="300" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/><text x="165" y="48" text-anchor="middle" font-size="14" font-weight="500" fill="#4A1B0C">groupBy result</text><text x="165" y="64" text-anchor="middle" font-size="12" fill="#712B13">rows collapsed — detail lost</text><rect x="32" y="78" width="120" height="26" rx="4" fill="#F0997B" stroke="#993C1D" stroke-width="0.5"/><text x="92" y="95" text-anchor="middle" font-size="12" font-weight="500" fill="#4A1B0C">payment</text><rect x="158" y="78" width="130" height="26" rx="4" fill="#F0997B" stroke="#993C1D" stroke-width="0.5"/><text x="223" y="95" text-anchor="middle" font-size="12" font-weight="500" fill="#4A1B0C">avg_fare</text><rect x="32" y="108" width="120" height="26" rx="3" fill="none" stroke="#F5C4B3" stroke-width="0.5"/><text x="92" y="125" text-anchor="middle" font-size="12" fill="#712B13">cash</text><rect x="158" y="108" width="130" height="26" rx="3" fill="none" stroke="#F5C4B3" stroke-width="0.5"/><text x="223" y="125" text-anchor="middle" font-size="12" fill="#712B13">$55.17</text><rect x="32" y="138" width="120" height="26" rx="3" fill="none" stroke="#F5C4B3" stroke-width="0.5"/><text x="92" y="155" text-anchor="middle" font-size="12" fill="#712B13">card</text><rect x="158" y="138" width="130" height="26" rx="3" fill="none" stroke="#F5C4B3" stroke-width="0.5"/><text x="223" y="155" text-anchor="middle" font-size="12" fill="#712B13">$66.83</text><text x="165" y="210" text-anchor="middle" font-size="12" fill="#993C1D">Which trips made up that average?</text><text x="165" y="228" text-anchor="middle" font-size="12" fill="#993C1D">Unknown. Rows are gone.</text><text x="165" y="280" text-anchor="middle" font-size="12" fill="#712B13">Use for: summary statistics only.</text><rect x="370" y="20" width="290" height="300" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="515" y="48" text-anchor="middle" font-size="14" font-weight="500" fill="#04342C">window rank() result</text><text x="515" y="64" text-anchor="middle" font-size="12" fill="#085041">all rows kept — rank added</text><rect x="382" y="78" width="90" height="26" rx="4" fill="#5DCAA5" stroke="#0F6E56" stroke-width="0.5"/><text x="427" y="95" text-anchor="middle" font-size="12" font-weight="500" fill="#04342C">payment</text><rect x="478" y="78" width="80" height="26" rx="4" fill="#5DCAA5" stroke="#0F6E56" stroke-width="0.5"/><text x="518" y="95" text-anchor="middle" font-size="12" font-weight="500" fill="#04342C">fare</text><rect x="564" y="78" width="54" height="26" rx="4" fill="#5DCAA5" stroke="#0F6E56" stroke-width="0.5"/><text x="591" y="95" text-anchor="middle" font-size="12" font-weight="500" fill="#04342C">rank</text><rect x="382" y="108" width="90" height="26" rx="3" fill="none" stroke="#9FE1CB" stroke-width="0.5"/><text x="427" y="125" text-anchor="middle" font-size="12" fill="#085041">cash</text><rect x="478" y="108" width="80" height="26" rx="3" fill="none" stroke="#9FE1CB" stroke-width="0.5"/><text x="518" y="125" text-anchor="middle" font-size="12" fill="#085041">$98.50</text><rect x="564" y="108" width="54" height="26" rx="3" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/><text x="591" y="125" text-anchor="middle" font-size="12" font-weight="500" fill="#412402">1</text><rect x="382" y="138" width="90" height="26" rx="3" fill="none" stroke="#9FE1CB" stroke-width="0.5"/><text x="427" y="155" text-anchor="middle" font-size="12" fill="#085041">cash</text><rect x="478" y="138" width="80" height="26" rx="3" fill="none" stroke="#9FE1CB" stroke-width="0.5"/><text x="518" y="155" text-anchor="middle" font-size="12" fill="#085041">$45.00</text><rect x="564" y="138" width="54" height="26" rx="3" fill="none" stroke="#9FE1CB" stroke-width="0.5"/><text x="591" y="155" text-anchor="middle" font-size="12" fill="#085041">2</text><rect x="382" y="168" width="90" height="26" rx="3" fill="none" stroke="#9FE1CB" stroke-width="0.5"/><text x="427" y="185" text-anchor="middle" font-size="12" fill="#085041">card</text><rect x="478" y="168" width="80" height="26" rx="3" fill="none" stroke="#9FE1CB" stroke-width="0.5"/><text x="518" y="185" text-anchor="middle" font-size="12" fill="#085041">$102.00</text><rect x="564" y="168" width="54" height="26" rx="3" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/><text x="591" y="185" text-anchor="middle" font-size="12" font-weight="500" fill="#412402">1</text><text x="515" y="240" text-anchor="middle" font-size="12" fill="#085041">Every trip visible. Rank added per group.</text><text x="515" y="280" text-anchor="middle" font-size="12" fill="#085041">Use for: top N, running totals, comparisons.</text></svg>